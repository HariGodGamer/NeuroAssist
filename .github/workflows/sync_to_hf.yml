name: Sync to Hugging Face Spaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Backend to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "krishnamgupta123@gmail.com"
          git config --global user.name "krishnamgupta123"
          git subtree split --prefix backend -b hf-deploy
          git push -f https://krishnamgupta123:${HF_TOKEN}@huggingface.co/spaces/krishnamgupta123/Neuroasisst hf-deploy:main
